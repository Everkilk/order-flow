services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    image: orderflow-backend:local
    env_file: .env.production
    command: ["node", "scripts/db.mjs", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: orderflow-backend:local
    restart: unless-stopped
    env_file: .env.production
    command: ["node", "dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - job_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: orderflow-backend:local
    restart: unless-stopped
    env_file: .env.production
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - job_data:/app/data

volumes:
  postgres_data:
  job_data:
