# Paid production Blueprint. For the free demo, follow docs/free-demo-deployment.md
# and create one Render Web Service manually instead of deploying this Blueprint.
services:
  - type: web
    name: orderflow-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health/ready
    preDeployCommand: node scripts/db.mjs migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
      - key: STORAGE_DRIVER
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: orderflow-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: orderflow-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    dockerCommand: node dist/worker.js
    preDeployCommand: node scripts/db.mjs migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: STORAGE_DRIVER
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: orderflow-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: orderflow-db
    databaseName: orderflow
    user: orderflow
    postgresMajorVersion: '18'
    plan: 0.5c-1g
    region: singapore
    ipAllowList: []
